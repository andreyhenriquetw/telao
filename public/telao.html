<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ranking da Noite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #ffd329;
        --cream: #fff8d8;
        --bg: #08051f;
        --blue: #1d63ff;
        --violet: #8c19ff;
      }
      @property --border-angle {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0turn;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(#08051f66, #08051f66),
          url("/fundo.png") center / cover,
          radial-gradient(ellipse at 78% 20%, #40209e 0, transparent 30%),
          radial-gradient(ellipse at 18% 80%, #102d9b 0, transparent 35%),
          linear-gradient(115deg, #07051a 0%, #111052 48%, #080523 100%);
        color: var(--cream);
        font-family: Manrope, sans-serif;
        overflow: hidden;
      }
      .condensed {
        font-family: "Barlow Condensed", sans-serif;
      }
      .scanlines {
        background-image:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff03 1px, transparent 1px);
        background-size:
          100% 5px,
          96px 96px;
        pointer-events: none;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: -1;
        pointer-events: none;
        width: 60vw;
        height: 2px;
        background: #22a9ff;
        box-shadow:
          0 0 20px #22a9ff,
          0 0 45px #5926ff;
        opacity: 0.7;
        transform: rotate(-12deg);
      }
      body::before {
        left: -12vw;
        top: 22%;
      }
      body::after {
        right: -12vw;
        top: 72%;
        transform: rotate(12deg);
      }
      .stage {
        position: relative;
        isolation: isolate;
      }
      .stage::after {
        content: "";
        position: absolute;
        z-index: -1;
        left: 3%;
        right: 3%;
        bottom: 2%;
        height: 20%;
        background: radial-gradient(ellipse, #4226ff66 0, transparent 68%);
        filter: blur(18px);
      }
      .title-glow {
        text-shadow:
          0 2px 0 #05030d,
          2px 0 0 #05030d,
          -2px 0 0 #05030d,
          0 0 12px #ffcf31aa,
          0 4px 0 #7b2600,
          0 0 32px #ff6a00;
      }
      .brand-header {
        position: relative;
        isolation: isolate;
        width: fit-content;
        padding: 0.35rem 0.75rem 0.55rem;
      }
      .brand-header::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 0 -1.25rem;
        background: linear-gradient(
          90deg,
          #05030de8,
          #05030db8 72%,
          transparent
        );
        filter: blur(7px);
      }
      .column-head {
        color: #fff;
        background: linear-gradient(90deg, #050607e8, #17130be8 50%, #050607e8);
        border: 1px solid #f4c542;
        box-shadow:
          0 0 14px #f4c54266,
          inset 0 0 14px #f4c54222;
        clip-path: polygon(1% 0, 99% 0, 100% 50%, 99% 100%, 1% 100%, 0 50%);
      }
      #ranking {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .podium {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr);
        align-items: end;
        gap: clamp(0.5rem, 1.6vw, 1.5rem);
        padding: 0 2.5% 0.75rem;
      }
      .podium-slot {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: stretch;
      }
      .podium-card {
        position: relative;
        min-width: 0;
        min-height: clamp(12rem, 22vh, 18rem);
        overflow: hidden;
        border: 3px solid #54dcffcc;
        border-radius: 18px 18px 7px 7px;
        background: linear-gradient(
          135deg,
          #111318d9 0%,
          #08090bd9 48%,
          #020304e8 100%
        );
        box-shadow:
          0 0 22px #20b8e677,
          0 18px 30px #000c,
          inset 0 0 28px #42d9ff20,
          inset 0 2px 0 #ffffff38;
        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .podium-card::before {
        content: "";
        position: absolute;
        z-index: 4;
        inset: 0;
        border: 2px solid #a8f2ffaa;
        border-radius: inherit;
        background:
          linear-gradient(90deg, #71e8ff, transparent 18% 82%, #71e8ff) top /
            100% 1px no-repeat,
          linear-gradient(90deg, #71e8ff, transparent 18% 82%, #71e8ff) bottom /
            100% 1px no-repeat;
        opacity: 0.92;
        pointer-events: none;
      }
      .podium-card::after {
        content: none;
      }
      .podium-card:nth-child(1) {
        animation-delay: 0.08s;
      }
      .podium-card:nth-child(2) {
        animation-delay: 0.02s;
      }
      .podium-card:nth-child(3) {
        animation-delay: 0.14s;
      }
      .podium-card.podium-1 {
        z-index: 2;
        min-height: clamp(17.25rem, 32.5vh, 25.5rem);
        top: -2.5rem;
        border-width: 3px;
        border-color: #ffe36e;
        background: linear-gradient(
          135deg,
          #151515e0 0%,
          #090a0ce3 48%,
          #020304ed 100%
        );
        box-shadow:
          0 0 28px #ffd21dcc,
          0 18px 42px #000d,
          inset 0 0 34px #ffdc3e3d,
          inset 0 2px 0 #fff6b866;
      }
      .podium-card.podium-2,
      .podium-card.podium-3 {
        min-height: clamp(8.25rem, 14.5vh, 11.5rem);
        top: 0.5rem;
      }
      .podium-card.podium-2 {
        border-width: 3px;
        border-color: #a9f4ff88;
        background: linear-gradient(
          135deg,
          #111318c9 0%,
          #08090bcc 48%,
          #020304df 100%
        );
        box-shadow:
          0 0 10px #53dce144,
          0 14px 28px #000d,
          inset 0 0 18px #53dce114;
      }
      .podium-card.podium-3 {
        border-width: 3px;
        border-color: #ff9a5d88;
        background: linear-gradient(
          135deg,
          #151515c9 0%,
          #090a0bcc 48%,
          #020304df 100%
        );
        box-shadow:
          0 0 10px #ff8b4d44,
          0 14px 28px #000d,
          inset 0 0 18px #ff9a5d14;
      }
      .podium-card.podium-2::before,
      .podium-card.podium-3::before {
        border-color: #a8f2ff55;
        opacity: 0.38;
      }
      .podium-card.podium-2::after,
      .podium-card.podium-3::after {
        opacity: 0.38;
        box-shadow: 0 0 8px #20d9ff66;
      }
      .podium-card.podium-1::before {
        background: conic-gradient(
          from var(--border-angle),
          transparent 0deg 190deg,
          #ffb30022 210deg,
          #ffb300aa 230deg,
          #ffd21d 248deg,
          #fff3a8 265deg,
          #ffffff 280deg,
          #fff3a8 295deg,
          #ffd21d 312deg,
          #ffb300aa 330deg,
          #ffb30022 345deg,
          transparent 355deg 360deg
        );
        border: 0;
        border-radius: inherit;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
        padding: 3px;
        filter: drop-shadow(0 0 6px #fff0a0) drop-shadow(0 0 18px #ffb300dd)
          drop-shadow(0 0 30px #ffd21d99);
        pointer-events: none;
        animation: goldBorderOrbit 4s linear infinite;
      }
      .podium-card.podium-1 .podium-position {
        min-height: clamp(4rem, 7vh, 6.5rem);
        font-size: clamp(3rem, 5vw, 5.5rem);
        text-shadow:
          0 3px 0 #05030d,
          2px 0 0 #05030d,
          -2px 0 0 #05030d,
          0 0 8px #fff,
          0 0 20px #ffd42a;
      }
      .podium-card.overtake {
        animation: podiumOvertake 1.8s ease-in-out both;
      }
      .podium-slot:has(.podium-card.overtake) .podium-crown,
      .podium-slot:has(.podium-card.overtake) .podium-rank {
        filter: brightness(1.18) saturate(1.12);
      }
      .rank-row.overtake {
        animation: rankRowOvertake 1.8s ease-in-out both;
      }
      .podium-crown {
        position: relative;
        isolation: isolate;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: clamp(6.5rem, 13vh, 12rem);
        margin-bottom: -0.5rem;
        color: #fff8a0;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(2.5rem, 5vw, 5.5rem);
        font-weight: 900;
        line-height: 1;
        text-shadow:
          0 3px 0 #633300,
          0 0 10px #fff7ad,
          0 0 24px #ffd21d;
        background: url("/coroa.png") center / contain no-repeat;
        border: 0;
        clip-path: none;
      }
      .podium-crown::before {
        content: none;
      }
      .podium-crown::after {
        content: none;
      }
      .podium-slot:has(.podium-card.podium-1) .podium-crown {
        top: -3rem;
        min-height: clamp(7.5rem, 15vh, 14rem);
        filter: drop-shadow(0 2px 0 #05030d) drop-shadow(2px 0 0 #05030d)
          drop-shadow(-2px 0 0 #05030d) drop-shadow(0 0 8px #fff4a0)
          drop-shadow(0 0 18px #ffd21d) drop-shadow(0 0 34px #ff9d00cc)
          brightness(1.12) saturate(1.18);
      }
      .podium-crown {
        text-align: center;
      }
      .crown-number {
        position: relative;
        z-index: 2;
        display: block;
        transform: translateY(0.35rem);
        color: #fffdf0;
        font-size: 1.12em;
        text-shadow:
          0 3px 0 #4a2104,
          0 0 5px #fff,
          0 0 18px #ffd42a;
      }
      .podium-position {
        position: relative;
        display: grid;
        place-items: center;
        min-height: clamp(3.5rem, 6vh, 5.5rem);
        color: #fff8d8;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(2.5rem, 4vw, 4.5rem);
        font-weight: 900;
        line-height: 1;
        text-shadow:
          0 3px 0 #4a2104,
          0 0 8px #fff,
          0 0 20px #ffd42a;
        border-bottom: 1px solid #f4c54266;
      }
      .podium-2 .podium-position {
        color: #f7ffff;
        text-shadow:
          0 3px 0 #05030d,
          2px 0 0 #05030d,
          -2px 0 0 #05030d,
          0 3px 0 #18333a,
          0 0 14px #a9f4ff;
      }
      .podium-3 .podium-position {
        color: #ffc27c;
        text-shadow:
          0 3px 0 #05030d,
          2px 0 0 #05030d,
          -2px 0 0 #05030d,
          0 3px 0 #5e2412,
          0 0 14px #ff9a5d;
      }
      .podium-2 .podium-details,
      .podium-3 .podium-details {
        padding-top: 0.55rem;
        padding-bottom: 0.7rem;
      }
      .podium-rank {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: clamp(4rem, 7vh, 6.5rem);
        margin-bottom: -0.35rem;
        background: none;
        border: 0;
        color: #f8f4df;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(2rem, 3.6vw, 4rem);
        font-weight: 900;
        line-height: 1;
        text-shadow:
          0 2px 0 #18333a,
          0 0 14px #ffd21d;
      }
      .podium-2 .podium-rank {
        min-height: clamp(4.5rem, 8vh, 7.5rem);
        color: #f7ffff;
        text-shadow:
          0 2px 0 #5b2600,
          0 0 14px #fff;
      }
      .podium-rank-image {
        display: block;
        width: 100%;
        height: clamp(4.5rem, 8vh, 7.5rem);
        margin-bottom: -0.35rem;
        object-fit: contain;
        object-position: center;
      }
      .podium-3 .podium-rank {
        min-height: clamp(4.5rem, 8vh, 7.5rem);
        color: #ffc27c;
        text-shadow:
          0 2px 0 #5e2412,
          0 0 14px #ff9a5d;
      }
      .podium-details {
        display: grid;
        gap: 0.22rem;
        padding: 0.85rem clamp(0.5rem, 1.2vw, 1.25rem) 1rem;
        text-align: center;
      }
      .podium-table,
      .podium-client {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #fff;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(1.4rem, 2.5vw, 2.8rem);
        font-weight: 900;
        text-transform: uppercase;
      }
      .podium-table.is-fitted {
        text-overflow: clip;
      }
      .podium-client {
        color: #f6f1d9;
        font-family: Manrope, sans-serif;
        font-size: clamp(0.8rem, 1.25vw, 1.3rem);
        font-weight: 800;
        text-shadow: 0 0 8px #fff8;
      }
      .podium-value {
        color: #ffe36b;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(1.7rem, 3.1vw, 3.5rem);
        font-weight: 900;
        text-shadow:
          0 2px 0 #05030d,
          2px 0 0 #05030d,
          -2px 0 0 #05030d,
          0 0 10px #ffb300,
          0 2px 0 #7b3a00;
        border-top: 1px solid #f4c54266;
        padding-top: 0.25rem;
      }
      .podium-card.podium-1 .podium-table {
        font-size: clamp(1.55rem, 2.8vw, 3.2rem);
      }
      .podium-card.podium-1 .podium-client {
        font-size: clamp(0.88rem, 1.35vw, 1.4rem);
      }
      .podium-card.podium-1 .podium-value {
        font-size: clamp(1.85rem, 3.3vw, 3.8rem);
      }
      .podium-card.podium-2 .podium-table,
      .podium-card.podium-3 .podium-table {
        font-size: clamp(1.25rem, 2.35vw, 2.6rem);
      }
      .podium-card.podium-2 .podium-client,
      .podium-card.podium-3 .podium-client {
        font-size: clamp(0.75rem, 1.15vw, 1.2rem);
      }
      .podium-card.podium-2 .podium-value,
      .podium-card.podium-3 .podium-value {
        font-size: clamp(1.55rem, 2.9vw, 3.25rem);
      }
      .ranking-list {
        display: grid;
        gap: 0.75rem;
      }
      .rank-row {
        position: relative;
        min-height: clamp(58px, 8.6vh, 92px);
        overflow: hidden;
        border: 1px solid #d4a62c;
        border-radius: 18px;
        background: linear-gradient(90deg, #030405e8, #131313d9 45%, #050607e8);
        box-shadow:
          0 0 8px #d4a62c55,
          0 0 24px #000b,
          inset 0 0 16px #f4c5421c;
        clip-path: polygon(
          1.2% 0,
          98.8% 0,
          100% 50%,
          98.8% 100%,
          1.2% 100%,
          0 50%
        );
        padding: 0.3rem 2.2rem 0.3rem 1.6rem;
      }
      .rank-row.rank-1 {
        border-color: #ffe27a;
        background: linear-gradient(90deg, #171006f2, #2a1c08e8 42%, #090a0be8);
        box-shadow:
          0 0 10px #ffd21daa,
          0 0 28px #ff970055,
          inset 0 0 18px #ffdc3e33;
      }
      .rank-row.rank-2 {
        border-color: #d9e2ec;
        background: linear-gradient(90deg, #04090bf2, #0b171be8 45%, #05090ae8);
        box-shadow:
          0 0 8px #b8c4d099,
          0 0 28px #000b,
          inset 0 0 18px #53dce133;
      }
      .rank-row.rank-3 {
        border-color: #cd7f32;
        background: linear-gradient(90deg, #120b08f2, #24140de8 45%, #08090ae8);
        box-shadow:
          0 0 8px #cd7f3288,
          0 0 25px #000b,
          inset 0 0 15px #ff9a3d33;
      }
      .rank-medal {
        display: grid;
        place-items: center;
        width: clamp(56px, 8vw, 112px);
        height: clamp(48px, 6.8vh, 72px);
        flex: 0 0 auto;
        color: #fff;
        font-size: clamp(2.25rem, 4.2vw, 4.4rem);
        line-height: 1;
        text-shadow:
          0 2px 0 #05030d,
          2px 0 0 #05030d,
          -2px 0 0 #05030d,
          0 2px 0 #191006,
          0 0 12px currentColor;
        background: linear-gradient(145deg, #3d3a2b, #100f0b);
        border: 2px solid #f4c542;
        box-shadow:
          0 0 10px #f4c54299,
          inset 0 0 12px #ffe78633;
        clip-path: polygon(15% 0, 85% 0, 100% 50%, 85% 100%, 15% 100%, 0 50%);
      }
      .rank-1 .rank-medal {
        color: #fff8a0;
        background: linear-gradient(145deg, #ffe66c, #a85c08);
        border-color: #fff4a0;
      }
      .rank-2 .rank-medal {
        color: #f2ffff;
        background: linear-gradient(
          145deg,
          #eaffff 0%,
          #69dfff 30%,
          #167e96 72%,
          #102f39 100%
        );
        border-color: #eaffff;
        box-shadow:
          0 0 10px #a9f4ff,
          0 0 22px #238dff;
      }
      .rank-3 .rank-medal {
        background: linear-gradient(145deg, #ffb14b, #a32816);
        border-color: #ffd28c;
      }
      .row-label {
        color: #fff;
        text-shadow: 0 0 8px #ffffff44;
      }
      .row-value {
        color: #ffe36b;
        text-shadow:
          0 2px 0 #05030d,
          2px 0 0 #05030d,
          -2px 0 0 #05030d,
          0 0 10px #ffb300,
          0 2px 0 #7b3a00;
      }
      .rabbit {
        position: absolute;
        z-index: 0;
        top: 17%;
        right: -1rem;
        width: clamp(190px, 25vw, 420px);
        max-height: 82vh;
        object-fit: contain;
        object-position: bottom center;
        filter: drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000)
          drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)
          drop-shadow(0 0 16px #ffd21d) drop-shadow(0 0 34px #ff9d00aa);
        pointer-events: none;
      }
      #rabbit-video {
        display: none;
      }
      #rabbit-canvas {
        display: none;
      }
      .ranking-panel {
        position: relative;
        z-index: 1;
        width: calc(100% - clamp(180px, 23vw, 390px));
      }
      @media (max-width: 720px) {
        body {
          overflow: auto;
        }
        main {
          min-height: 100vh;
          padding: 1.2rem 0.75rem;
        }
        .rank-row {
          padding-left: 0.6rem;
          padding-right: 0.8rem;
          gap: 0.5rem;
          border-radius: 12px;
        }
        .rank-medal {
          width: 3.5rem;
        }
        .rabbit {
          display: none;
        }
        .ranking-panel {
          width: 100%;
        }
        .podium {
          gap: 0.35rem;
          padding-inline: 0;
        }
        .podium-details {
          padding-inline: 0.25rem;
        }
      }
      .rank-row {
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .rank-row:nth-child(2) {
        animation-delay: 0.05s;
      }
      .rank-row:nth-child(3) {
        animation-delay: 0.1s;
      }
      .rank-row:nth-child(4) {
        animation-delay: 0.15s;
      }
      .rank-row:nth-child(5) {
        animation-delay: 0.2s;
      }
      .rank-row:nth-child(6) {
        animation-delay: 0.25s;
      }
      .rank-row:nth-child(7) {
        animation-delay: 0.3s;
      }
      .rank-row:nth-child(8) {
        animation-delay: 0.35s;
      }
      .rank-row:nth-child(9) {
        animation-delay: 0.4s;
      }
      .rank-row:nth-child(10) {
        animation-delay: 0.45s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes goldBorderOrbit {
        from {
          --border-angle: 0turn;
        }
        to {
          --border-angle: 1turn;
        }
      }
      @keyframes podiumOvertake {
        0%,
        100% {
          box-shadow:
            0 0 14px #d4a62c55,
            inset 0 0 18px #f4c5421c;
        }
        35% {
          box-shadow:
            0 0 20px #fff0a0,
            0 0 48px #ffd21daa,
            inset 0 0 26px #ffe66e66;
        }
        65% {
          box-shadow:
            0 0 12px #ffd21dcc,
            0 0 30px #ff970088,
            inset 0 0 20px #ffdc3e44;
        }
      }
      @keyframes rankRowOvertake {
        0%,
        100% {
          filter: brightness(1);
          box-shadow:
            0 0 8px #f4c54255,
            0 0 28px #000b,
            inset 0 0 18px #53dce133;
        }
        35% {
          filter: brightness(1.18) saturate(1.12);
          box-shadow:
            0 0 20px #fff0a0,
            0 0 48px #ffd21daa,
            inset 0 0 26px #ffe66e66;
        }

    <script>
      const money = (value) =>
        `R$ ${Number(value).toLocaleString("pt-BR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })}`;
      const ranking = document.querySelector("#ranking");
      const confettiLayer = document.querySelector("#confetti-layer");
      const rankConfettiLayer = document.querySelector("#rank-confetti");
      const flashVideo = document.querySelector("#flash-video");
      const rabbitImage = document.querySelector("#rabbit-image");
      const rabbitVideo = document.querySelector("#rabbit-video");
      const rabbitCanvas = document.querySelector("#rabbit-canvas");
      const showcase = document.querySelector("#showcase");
      const showcaseImages = [
        ...showcase.querySelectorAll("img.showcase-image"),
      ];
      const showcaseVideos = [
        ...showcase.querySelectorAll("video.showcase-video"),
      ];
      const showcaseOverlayImages = [
        ...showcase.querySelectorAll("img.showcase-overlay"),
      ];
      const showcaseOverlayVideos = [
        ...showcase.querySelectorAll("video.showcase-overlay"),
      ];
      let showcaseLayerIndex = 0;
      const fallbackShowcaseMedia = [
        {
          source: "/001.png",
          duration: 16000,
          type: "image",
          contain: true,
        },
        { source: "/002.jpeg", duration: 32000, type: "image" },
        { source: "/003.mp4", duration: 20000, type: "video" },
        { source: "/004.jpeg", duration: 32000, type: "image" },
        { source: "/005.jpeg", duration: 16000, type: "image" },
        { source: "/007.jpeg", duration: 16000, type: "image" },
        {
          source: "/008.jpeg",
          duration: 17000,
          type: "image",
          stretch: true,
        },
        {
          source: "/010.png",
          duration: 16000,
          type: "image",
          contain: true,
        },
        { source: "/011.jpeg", duration: 15000, type: "image" },
      ];
      let showcaseMedia = fallbackShowcaseMedia;
      let showcaseMediaSignature = "";
      let currentRanking = [];
      let showcaseStarted = false;
      let showcaseRun = 0;
      let showcaseStartTimer = null;
      let flashTimer = null;
      let flashRun = 0;
      let rankConfettiTimer = null;
      let rankingSnapshot = new Map();
      let lastAlertKey = "";
      let rabbitFrameRequest = 0;
      let rabbitRendering = false;
      let showcaseRefreshPending = false;
      const showcasePreloadCache = new Map();
      const rabbitContext = rabbitCanvas.getContext("2d", {
        willReadFrequently: true,
      });
      async function loadShowcaseMedia() {
        try {
          const response = await fetch(`/api/slide?poll=${Date.now()}`, {
            cache: "no-store",
          });
          if (!response.ok) return;
          const items = await response.json();
          if (items.length) {
            const nextMedia = items.map((item) => ({
              ...item,
              duration: Number(item.duration),
              contain: item.fit === "contain",
              stretch: item.fit === "fill",
            }));
            const nextSignature = JSON.stringify(
              nextMedia.map((item) => ({
                id: item.id,
                position: item.position,
                source: item.source,
                duration: item.duration,
                fit: item.fit,
                overlaySource: item.overlaySource,
              })),
            );
            const changed = nextSignature !== showcaseMediaSignature;
            showcaseMedia = nextMedia;
            showcaseMediaSignature = nextSignature;
            return changed;
          }
        } catch (error) {
          console.warn(
            "Programação visual indisponível; usando a lista local.",
            error,
          );
        }
        return false;
      }
      async function refreshShowcase() {
        if (showcaseRefreshPending) return;
        showcaseRefreshPending = true;
        try {
          const changed = await loadShowcaseMedia();
          if (!changed) return;
          await stopShowcase(true);
          showcaseStartTimer = setTimeout(startShowcase, 150);
        } finally {
          showcaseRefreshPending = false;
        }
      }
      function renderRabbitFrame() {
        if (rabbitVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          const renderWidth = Math.min(rabbitVideo.videoWidth, 480);
          const renderHeight = Math.round(
            renderWidth * (rabbitVideo.videoHeight / rabbitVideo.videoWidth),
          );
          if (
            rabbitCanvas.width !== renderWidth ||
            rabbitCanvas.height !== renderHeight
          ) {
            rabbitCanvas.width = renderWidth;
            rabbitCanvas.height = renderHeight;
          }
          rabbitContext.drawImage(
            rabbitVideo,
            0,
            0,
            rabbitCanvas.width,
            rabbitCanvas.height,
          );
          const frame = rabbitContext.getImageData(
            0,
            0,
            rabbitCanvas.width,
            rabbitCanvas.height,
          );
          for (let index = 0; index < frame.data.length; index += 4) {
            const red = frame.data[index];
            const green = frame.data[index + 1];
            const blue = frame.data[index + 2];
            const brightness = Math.max(red, green, blue);
            if (brightness < 30) {
              frame.data[index + 3] = 0;
            } else if (brightness < 58) {
              frame.data[index + 3] = Math.round(
                ((brightness - 30) / 28) * 255,
              );
            }
          }
          rabbitContext.putImageData(frame, 0, 0);
        }
        if (rabbitRendering) {
          rabbitFrameRequest = requestAnimationFrame(renderRabbitFrame);
        }
      }
      function startRabbitVideo() {
        rabbitVideo.play().catch(() => {});
        if (rabbitRendering) return;
        rabbitRendering = true;
        rabbitImage.style.display = "none";
        rabbitCanvas.style.display = "block";
        cancelAnimationFrame(rabbitFrameRequest);
        renderRabbitFrame();
      }
      rabbitVideo.addEventListener("loadedmetadata", startRabbitVideo);
      rabbitVideo.addEventListener("canplay", startRabbitVideo);
      function activateRabbitVideo() {
        if (!rabbitVideo.src) {
          rabbitVideo.src = rabbitVideo.dataset.src;
          rabbitVideo.load();
        } else {
          rabbitVideo.currentTime = 0;
          startRabbitVideo();
        }
      }
      function restoreRabbitImage() {
        rabbitRendering = false;
        cancelAnimationFrame(rabbitFrameRequest);
        rabbitFrameRequest = 0;
        rabbitVideo.pause();
        rabbitCanvas.style.display = "none";
        rabbitImage.style.display = "block";
      }
      function launchCelebration() {
        const colors = ["#ffd42a", "#4ce8ff", "#ff4fc5", "#ffffff", "#8d61ff"];
        const pieces = Array.from({ length: 44 }, (_, index) => {
          const piece = document.createElement("i");
          piece.className = "confetti";
          piece.style.setProperty("--x", `${(index * 37) % 100}%`);
          piece.style.setProperty("--drift", `${((index * 29) % 160) - 80}px`);
          piece.style.setProperty("--size", `${5 + (index % 4) * 2}px`);
          piece.style.setProperty("--duration", `${4.2 + (index % 5) * 0.55}s`);
          piece.style.setProperty("--delay", `${(index % 9) * 0.12}s`);
          piece.style.setProperty("--color", colors[index % colors.length]);
          return piece;
        });
        confettiLayer.replaceChildren(...pieces);
      }
      function launchOvertakeConfetti() {
        clearTimeout(rankConfettiTimer);
        const colors = ["#ffd42a", "#fff4a0", "#ffb300", "#ffffff", "#4ce8ff"];
        const fireworks = [
          ["7%", "39%", "#ffb300", "0.05s"],
          ["18%", "30%", "#ffd42a", "0s"],
          ["31%", "18%", "#4ce8ff", "0.5s"],
          ["50%", "19%", "#ffffff", "0.35s"],
          ["69%", "18%", "#ffd42a", "0.8s"],
          ["82%", "32%", "#4ce8ff", "0.7s"],
          ["93%", "39%", "#ffb300", "1.05s"],
        ].map(([x, y, color, delay]) => {
          const burst = document.createElement("div");
          burst.className = "rank-burst";
          burst.style.setProperty("--x", x);
          burst.style.setProperty("--y", y);
          burst.style.setProperty("--color", color);
          burst.style.setProperty("--burst-delay", delay);
          for (let sparkIndex = 0; sparkIndex < 18; sparkIndex += 1) {
            const spark = document.createElement("i");
            spark.className = "rank-spark";
            spark.style.setProperty("--angle", `${sparkIndex * 20}deg`);
            spark.style.setProperty(
              "--distance",
              `${28 + (sparkIndex % 4) * 9}px`,
            );
            spark.style.setProperty("--color", color);
            burst.appendChild(spark);
          }
          return burst;
        });
        const pieces = Array.from({ length: 54 }, (_, index) => {
          const piece = document.createElement("i");
          piece.className = "rank-confetti-piece";
          piece.style.setProperty("--x", `${12 + ((index * 31) % 76)}%`);
          piece.style.setProperty("--drift", `${((index * 43) % 180) - 90}px`);
          piece.style.setProperty("--size", `${5 + (index % 4) * 2}px`);
          piece.style.setProperty("--duration", `${3.4 + (index % 7) * 0.28}s`);
          piece.style.setProperty("--delay", `${(index % 9) * 0.07}s`);
          piece.style.setProperty("--color", colors[index % colors.length]);
          return piece;
        });
        rankConfettiLayer.replaceChildren(...fireworks, ...pieces);
        rankConfettiTimer = setTimeout(() => {
          rankConfettiLayer.replaceChildren();
        }, 6200);
      }
      function esc(v) {
        return String(v).replace(
          /[&<>'"]/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[c],
        );
      }
      function fitPodiumNames() {
        document.querySelectorAll(".podium-table").forEach((element) => {
          element.style.fontSize = "";
          element.classList.remove("is-fitted");
          if (element.scrollWidth <= element.clientWidth) return;
          let fontSize = parseFloat(getComputedStyle(element).fontSize);
          while (element.scrollWidth > element.clientWidth && fontSize > 14) {
            fontSize -= 1;
            element.style.fontSize = `${fontSize}px`;
          }
          element.classList.add("is-fitted");
        });
      }
      function render(rows = [], animate = false) {
        const previousPositionById = new Map(
          currentRanking.map((item, index) => [item.id, index + 1]),
        );
        const previousPositions = new Map(
          [...ranking.querySelectorAll("[data-ranking-id]")].map((element) => [
            element.dataset.rankingId,
            element.getBoundingClientRect().top,
          ]),
        );
        currentRanking = rows;
        document
          .querySelector("#empty")
          .classList.toggle("hidden", rows.length > 0);
        const visibleRows = rows.slice(0, 6);
        const podiumRows = visibleRows.slice(0, 3);
        const continuationRows = visibleRows.slice(3);
        const overtakeIds = new Set(
          animate
            ? rows
                .filter((item, index) => {
                  const previousPosition = previousPositionById.get(item.id);
                  const currentPosition = index + 1;
                  return (
                    previousPosition && previousPosition !== currentPosition
                  );
                })
                .map((item) => item.id)
            : [],
        );
        const podiumCard = (item, position) =>
          `<div class="podium-slot">${position === 1 ? '<div class="podium-crown"></div>' : position === 2 ? '<img class="podium-rank-image" src="/prata.png" alt="" />' : position === 3 ? '<img class="podium-rank-image" src="/bronze.png" alt="" />' : '<div class="podium-rank"></div>'}<article data-ranking-id="${item.id}" class="podium-card podium-${position}"><div class="podium-position">${position}</div><div class="podium-details"><span class="podium-table">${esc(item.nomeCliente)}</span><span class="podium-client">${esc(item.numero)}</span><span class="podium-value">${money(item.totalGasto)}</span></div></article></div>`;
        ranking.innerHTML = `${
          podiumRows.length
            ? `<div class="podium">${[
                podiumRows[1],
                podiumRows[0],
                podiumRows[2],
              ]
                .filter(Boolean)
                .map((item) => podiumCard(item, podiumRows.indexOf(item) + 1))
                .join("")}</div>`
            : ""
        }<div class="ranking-list">${continuationRows
          .map((item, offset) => {
            const position = offset + 4;
            return `<article data-ranking-id="${item.id}" class="rank-row rank-${position} grid grid-cols-[clamp(56px,8vw,112px)_minmax(100px,1fr)_minmax(0,2fr)_minmax(130px,1fr)] items-center gap-4 text-center md:gap-8"><span class="rank-medal condensed">${position}</span><span class="row-label min-w-0 truncate text-center condensed text-2xl font-black uppercase md:text-5xl">${esc(item.numero)}</span><span class="row-label min-w-0 truncate text-center text-base font-bold uppercase md:text-3xl">${esc(item.nomeCliente)}</span><span class="row-value min-w-0 whitespace-nowrap text-center condensed text-2xl font-black md:text-5xl">${money(item.totalGasto)}</span></article>`;
          })
          .join("")}</div>`;
        requestAnimationFrame(fitPodiumNames);
        if (animate) {
          const movedRows = [...ranking.querySelectorAll("[data-ranking-id]")]
            .map((element) => ({
              element,
              distance:
                previousPositions.get(element.dataset.rankingId) -
                element.getBoundingClientRect().top,
            }))
            .filter(
              ({ distance }) =>
                Number.isFinite(distance) && Math.abs(distance) > 2,
            );
          movedRows.forEach(({ element, distance }) => {
            element.classList.add("reordering");
            element.style.transform = `translateY(${distance}px)`;
            element.style.transition = "none";
          });
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              movedRows.forEach(({ element }) => {
                element.style.transition =
                  "transform 2.6s cubic-bezier(0.22, 0.8, 0.2, 1)";
                element.style.transform = "translateY(0)";
              });
              ranking
                .querySelectorAll("[data-ranking-id]")
                .forEach((element) => {
                  if (overtakeIds.has(element.dataset.rankingId)) {
                    element.classList.add("overtake");
                  }
                });
              if (overtakeIds.size > 0) launchOvertakeConfetti();
            });
          });
        }
      }
      window.addEventListener("resize", () =>
        requestAnimationFrame(fitPodiumNames),
      );
      async function load() {
        try {
          const response = await fetch("/api/camarotes", {
            cache: "no-store",
          });
          const rows = await response.json();
          rankingSnapshot = new Map(
            rows.map((item) => [item.id, Number(item.totalGasto)]),
          );
          render(rows);
        } catch (error) {
          console.error(error);
        }
      }
      async function pollRanking() {
        try {
          const response = await fetch(`/api/camarotes?poll=${Date.now()}`, {
            cache: "no-store",
          });
          if (!response.ok) return;
          const rows = await response.json();
          const changedItem = rows.find(
            (item) =>
              !rankingSnapshot.has(item.id) ||
              Number(item.totalGasto) !== rankingSnapshot.get(item.id),
          );
          const previousTotal = changedItem
            ? rankingSnapshot.get(changedItem.id) || 0
            : 0;
          rankingSnapshot = new Map(
            rows.map((item) => [item.id, Number(item.totalGasto)]),
          );
          if (!changedItem) return;
          const amount = Math.max(
            0,
            Number(changedItem.totalGasto) - previousTotal,
          );
          handleNewSale({
            venda: changedItem,
            transacao: { valor: amount },
            ranking: rows,
          });
        } catch (error) {
          console.warn(
            "Atualização automática do ranking indisponível:",
            error,
          );
        }
      }
      async function startShowcase() {
        if (showcaseStarted) return;
        showcaseStarted = true;
        restoreRabbitImage();
        const currentRun = ++showcaseRun;
        let firstRound = true;
        while (currentRun === showcaseRun) {
          if (!firstRound)
            await new Promise((resolve) => setTimeout(resolve, 30000));
          if (currentRun !== showcaseRun) return;
          firstRound = false;
          let showcaseVisible = !showcase.classList.contains("hidden");
          for (const media of showcaseMedia) {
            const mediaReady = await preloadShowcaseMedia(
              media.source,
              media.type,
            );
            if (currentRun !== showcaseRun) return;
            if (!mediaReady) continue;
            if (media.overlaySource) {
              const overlayReady = await preloadShowcaseMedia(
                media.overlaySource,
                media.overlayType,
              );
              if (currentRun !== showcaseRun) return;
              if (!overlayReady) continue;
            }
            const activeLayerIndex = showcaseLayerIndex;
            const inactiveLayerIndex = 1 - activeLayerIndex;
            const activeMedia =
              media.type === "video"
                ? showcaseVideos[activeLayerIndex]
                : showcaseImages[activeLayerIndex];
            const inactiveMedia =
              media.type === "video"
                ? showcaseVideos[inactiveLayerIndex]
                : showcaseImages[inactiveLayerIndex];
            activeMedia.className = `showcase-image is-entering${media.contain ? " showcase-image-contained" : ""}${media.stretch ? " showcase-image-stretched" : ""}`;
            if (media.type === "video") {
              activeMedia.src = media.source;
              activeMedia.currentTime = 0;
              activeMedia.play().catch(() => {});
            } else {
              activeMedia.src = media.source;
            }
            if (media.overlaySource) {
              const activeOverlay =
                media.overlayType === "video"
                  ? showcaseOverlayVideos[activeLayerIndex]
                  : showcaseOverlayImages[activeLayerIndex];
              showcaseOverlayImages[inactiveLayerIndex].classList.add(
                "is-leaving",
              );
              showcaseOverlayVideos[inactiveLayerIndex].classList.add(
                "is-leaving",
              );
              showcaseOverlayImages[activeLayerIndex].className =
                "showcase-overlay";
              showcaseOverlayVideos[activeLayerIndex].className =
                "showcase-overlay";
              activeOverlay.className = "showcase-overlay is-active";
              activeOverlay.src = media.overlaySource;
              if (media.overlayType === "video") {
                activeOverlay.currentTime = 0;
                activeOverlay.play().catch(() => {});
              }
            } else {
              showcaseOverlayImages[inactiveLayerIndex].classList.add(
                "is-leaving",
              );
              showcaseOverlayVideos[inactiveLayerIndex].classList.add(
                "is-leaving",
              );
              showcaseOverlayImages[activeLayerIndex].className =
                "showcase-overlay";
              showcaseOverlayVideos[activeLayerIndex].className =
                "showcase-overlay";
              showcaseOverlayImages[activeLayerIndex].removeAttribute("src");
              showcaseOverlayVideos[activeLayerIndex].removeAttribute("src");
              showcaseOverlayVideos[activeLayerIndex].pause();
            }
            if (!showcaseVisible) {
              showcase.classList.remove("hidden");
              showcase.classList.add("flex", "is-active");
              showcaseVisible = true;
            }
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                activeMedia.classList.add("is-visible");
                inactiveMedia.classList.add("is-leaving");
              });
            });
            showcaseLayerIndex = inactiveLayerIndex;
            await new Promise((resolve) => setTimeout(resolve, media.duration));
            if (currentRun !== showcaseRun) return;
            if (media.overlayType === "video") {
              showcaseOverlayVideos[activeLayerIndex].pause();
            }
            if (media.type === "video") activeMedia.pause();
          }
          showcase.classList.remove("is-active");
          await new Promise((resolve) => setTimeout(resolve, 800));
          showcase.classList.remove("flex");
          showcase.classList.add("hidden");
        }
      }
      function preloadShowcaseMedia(source, type) {
        if (!source) return Promise.resolve(true);
        const cacheKey = `${type}:${source}`;
        const cached = showcasePreloadCache.get(cacheKey);
        if (cached) return cached;
        const preload =
          type === "video"
            ? new Promise((resolve) => {
                const video = document.createElement("video");
                let settled = false;
                const finish = (ready) => {
                  if (settled) return;
                  settled = true;
                  video.removeAttribute("src");
                  video.load();
                  if (!ready) showcasePreloadCache.delete(cacheKey);
                  resolve(ready);
                };
                video.muted = true;
                video.preload = "auto";
                video.addEventListener("canplay", () => finish(true), {
                  once: true,
                });
                video.addEventListener("error", () => finish(false), {
                  once: true,
                });
                video.src = source;
                video.load();
              })
            : new Promise((resolve) => {
                const image = new Image();
                image.onload = () => resolve(true);
                image.onerror = () => {
                  showcasePreloadCache.delete(cacheKey);
                  resolve(false);
                };
                image.src = source;
              });
        showcasePreloadCache.set(cacheKey, preload);
        return preload;
      }
      async function stopShowcase(keepVisible = false) {
        clearTimeout(showcaseStartTimer);
        showcaseStartTimer = null;
        showcaseRun += 1;
        showcaseStarted = false;
        const wasVisible = !showcase.classList.contains("hidden");
        if (keepVisible && wasVisible) {
          showcase.classList.add("flex", "is-active");
          showcase.classList.remove("hidden");
        } else {
          showcase.classList.remove("is-active", "flex");
          showcase.classList.add("hidden");
        }
        showcaseImages.forEach((image) => {
          image.className = "showcase-image";
          image.removeAttribute("src");
        });
        showcaseVideos.forEach((video) => {
          video.pause();
          video.className = "showcase-image showcase-video";
          video.removeAttribute("src");
        });
        showcaseOverlayImages.forEach((image) => {
          image.className = "showcase-overlay";
          image.removeAttribute("src");
        });
        showcaseOverlayVideos.forEach((video) => {
          video.pause();
          video.className = "showcase-overlay";
          video.removeAttribute("src");
        });
        showcaseLayerIndex = 0;
      }
      function celebrate(venda, transacao, afterAlert) {
        const currentFlashRun = ++flashRun;
        clearTimeout(flashTimer);
        document.querySelector("#flash-number").textContent = venda.nomeCliente;
        document.querySelector("#flash-client").textContent = venda.numero;
        document.querySelector("#flash-value").textContent = `+ ${money(
          transacao.valor,
        )}`;
        const flash = document.querySelector("#flash");
        launchCelebration();
        flashVideo.currentTime = 0;
        flash.classList.remove("hidden");
        flash.classList.add("flex");
        let flashFinished = false;
        const finishFlash = () => {
          if (flashFinished || currentFlashRun !== flashRun) return;
          flashFinished = true;
          clearTimeout(flashTimer);
          flash.classList.add("hidden");
          flash.classList.remove("flex");
          flashVideo.pause();
          confettiLayer.replaceChildren();
          activateRabbitVideo();
          requestAnimationFrame(() => {
            requestAnimationFrame(afterAlert);
          });
        };
        flashVideo.onended = finishFlash;
        flashVideo.onerror = finishFlash;
        flashTimer = setTimeout(finishFlash, 10000);
        flashVideo.play().catch(() => {});
      }
      async function handleNewSale(data) {
        const alertKey = `${data.venda.id}:${data.venda.totalGasto}`;
        if (alertKey === lastAlertKey) return;
        lastAlertKey = alertKey;
        await stopShowcase();
        celebrate(data.venda, data.transacao, () => {
          render(data.ranking, true);
          showcaseStartTimer = setTimeout(startShowcase, 30000);
        });
      }
      const socket = typeof io === "function" ? io() : null;
      if (socket) {
        socket.on("NOVA_VENDA", async (data) => {
          data.ranking.forEach((item) =>
            rankingSnapshot.set(item.id, Number(item.totalGasto)),
          );
          handleNewSale(data);
        });
        socket.on("RANKING_RESET", () => render([]));
        socket.on("SLIDE_ATUALIZADO", refreshShowcase);
      }
      load();
      loadShowcaseMedia();
      setInterval(refreshShowcase, 2000);
      setInterval(pollRanking, 2000);
      showcaseStartTimer = setTimeout(startShowcase, 5000);
      setInterval(
        () =>
          (document.querySelector("#clock").textContent =
            new Date().toLocaleTimeString("pt-BR", {
              hour: "2-digit",
              minute: "2-digit",
            })),
        1000,
      );
    </script>
  </body>
</html>
