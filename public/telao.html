<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ranking da Noite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #ffd329;
        --cream: #fff8d8;
        --bg: #08051f;
        --blue: #1d63ff;
        --violet: #8c19ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(#08051f66, #08051f66),
          url("/fundo.jpg") center / cover,
          radial-gradient(ellipse at 78% 20%, #40209e 0, transparent 30%),
          radial-gradient(ellipse at 18% 80%, #102d9b 0, transparent 35%),
          linear-gradient(115deg, #07051a 0%, #111052 48%, #080523 100%);
        color: var(--cream);
        font-family: Manrope, sans-serif;
        overflow: hidden;
      }
      .condensed {
        font-family: "Barlow Condensed", sans-serif;
      }
      .scanlines {
        background-image:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff03 1px, transparent 1px);
        background-size:
          100% 5px,
          96px 96px;
        pointer-events: none;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: -1;
        pointer-events: none;
        width: 60vw;
        height: 2px;
        background: #22a9ff;
        box-shadow:
          0 0 20px #22a9ff,
          0 0 45px #5926ff;
        opacity: 0.7;
        transform: rotate(-12deg);
      }
      body::before {
        left: -12vw;
        top: 22%;
      }
      body::after {
        right: -12vw;
        top: 72%;
        transform: rotate(12deg);
      }
      .stage {
        position: relative;
        isolation: isolate;
      }
      .stage::after {
        content: "";
        position: absolute;
        z-index: -1;
        left: 3%;
        right: 3%;
        bottom: 2%;
        height: 20%;
        background: radial-gradient(ellipse, #4226ff66 0, transparent 68%);
        filter: blur(18px);
      }
      .title-glow {
        text-shadow:
          0 0 12px #ffcf31aa,
          0 4px 0 #7b2600,
          0 0 32px #ff6a00;
      }
      .column-head {
        color: #fff;
        background: linear-gradient(90deg, #2b16a9, #4113d2 50%, #28108f);
        border: 1px solid #7138ff;
        box-shadow:
          0 0 16px #401dff99,
          inset 0 0 12px #8e45ff66;
        clip-path: polygon(1% 0, 99% 0, 100% 50%, 99% 100%, 1% 100%, 0 50%);
      }
      .rank-row {
        position: relative;
        min-height: clamp(58px, 8.6vh, 92px);
        overflow: hidden;
        border: 2px solid #7224ff;
        border-radius: 18px;
        background: linear-gradient(90deg, #13107eeb, #1524c9dc 45%, #201179e8);
        box-shadow:
          0 0 8px #6e20ff,
          0 0 22px #2f3dff88,
          inset 0 0 14px #6d5dff66;
        clip-path: polygon(
          1.2% 0,
          98.8% 0,
          100% 50%,
          98.8% 100%,
          1.2% 100%,
          0 50%
        );
        padding: 0.3rem 2.2rem 0.3rem 1.6rem;
      }
      .rank-row.rank-1 {
        border-color: #ffd21d;
        background: linear-gradient(90deg, #8c3b00f0, #592000dd 42%, #2f126d);
        box-shadow:
          0 0 9px #ffd21d,
          0 0 28px #ff970088,
          inset 0 0 18px #ffdc3e66;
      }
      .rank-row.rank-2 {
        border-color: #8eeaff;
        background: linear-gradient(90deg, #1047c9f5, #176fe8ee 45%, #3120a8f0);
        box-shadow:
          0 0 10px #62dcff,
          0 0 28px #238dffcc,
          0 0 48px #315dff88,
          inset 0 0 18px #72ddff99;
      }
      .rank-row.rank-3 {
        border-color: #ff832a;
        box-shadow:
          0 0 9px #ff5d23,
          0 0 25px #ff3a7788,
          inset 0 0 15px #ff9a3d66;
      }
      .rank-medal {
        display: grid;
        place-items: center;
        width: clamp(56px, 8vw, 112px);
        height: clamp(48px, 6.8vh, 72px);
        flex: 0 0 auto;
        color: #fff;
        font-size: clamp(2.25rem, 4.2vw, 4.4rem);
        line-height: 1;
        text-shadow:
          0 2px 0 #25106e,
          0 0 12px currentColor;
        background: linear-gradient(145deg, #8c40ff, #4010ca);
        border: 2px solid #c378ff;
        clip-path: polygon(15% 0, 85% 0, 100% 50%, 85% 100%, 15% 100%, 0 50%);
      }
      .rank-1 .rank-medal {
        color: #fff8a0;
        background: linear-gradient(145deg, #ffdf39, #b94700);
        border-color: #fff4a0;
      }
      .rank-2 .rank-medal {
        color: #f2ffff;
        background: linear-gradient(
          145deg,
          #eaffff 0%,
          #69dfff 30%,
          #2071e8 72%,
          #2437a8 100%
        );
        border-color: #eaffff;
        box-shadow:
          0 0 10px #a9f4ff,
          0 0 22px #238dff;
      }
      .rank-3 .rank-medal {
        background: linear-gradient(145deg, #ffb14b, #a32816);
        border-color: #ffd28c;
      }
      .row-label {
        color: #fff;
        text-shadow: 0 0 8px #ffffff55;
      }
      .row-value {
        color: #fff200;
        text-shadow:
          0 0 10px #ff9b00,
          0 2px 0 #7b3a00;
      }
      .rabbit {
        position: absolute;
        z-index: 0;
        top: 17%;
        right: -1rem;
        width: clamp(190px, 25vw, 420px);
        max-height: 82vh;
        object-fit: contain;
        object-position: bottom center;
        filter: drop-shadow(0 0 16px #2d64ff) drop-shadow(0 0 34px #7c1cff);
        pointer-events: none;
      }
      .ranking-panel {
        position: relative;
        z-index: 1;
        width: calc(100% - clamp(180px, 23vw, 390px));
      }
      @media (max-width: 720px) {
        body {
          overflow: auto;
        }
        main {
          min-height: 100vh;
          padding: 1.2rem 0.75rem;
        }
        .rank-row {
          padding-left: 0.6rem;
          padding-right: 0.8rem;
          gap: 0.5rem;
          border-radius: 12px;
        }
        .rank-medal {
          width: 3.5rem;
        }
        .rabbit {
          display: none;
        }
        .ranking-panel {
          width: 100%;
        }
      }
      .rank-row {
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .rank-row:nth-child(2) {
        animation-delay: 0.05s;
      }
      .rank-row:nth-child(3) {
        animation-delay: 0.1s;
      }
      .rank-row:nth-child(4) {
        animation-delay: 0.15s;
      }
      .rank-row:nth-child(5) {
        animation-delay: 0.2s;
      }
      .rank-row:nth-child(6) {
        animation-delay: 0.25s;
      }
      .rank-row:nth-child(7) {
        animation-delay: 0.3s;
      }
      .rank-row:nth-child(8) {
        animation-delay: 0.35s;
      }
      .rank-row:nth-child(9) {
        animation-delay: 0.4s;
      }
      .rank-row:nth-child(10) {
        animation-delay: 0.45s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .rank-row.reordering {
        animation: none;
        will-change: transform;
      }
      .rank-row .row-label {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        overflow-wrap: normal;
        word-break: normal;
        hyphens: none;
        line-height: 0.95;
      }
      #flash {
        overflow: hidden;
        background: radial-gradient(circle, #47300c 0, #08090b 70%);
        animation: flashIn 0.45s ease-out;
      }
      #showcase {
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, #1d1759 0, transparent 46%),
          #05040d;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #showcase.is-active {
        opacity: 1;
      }
      #showcase::before,
      #showcase::after {
        content: "";
        position: absolute;
        width: 42vw;
        height: 1px;
        background: #6ce8ff;
        box-shadow: 0 0 22px 5px #6ce8ff88;
        opacity: 0.7;
      }
      #showcase::before {
        top: 18%;
        left: -5%;
        transform: rotate(-18deg);
      }
      #showcase::after {
        right: -5%;
        bottom: 18%;
        transform: rotate(-18deg);
      }
      .showcase-image {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: drop-shadow(0 24px 46px #000b);
        opacity: 0;
        transform: translate3d(12vw, 8vh, 0) scale(0.78) rotate(3deg);
      }
      .showcase-video {
        object-fit: cover;
      }
      .showcase-image-contained {
        object-fit: contain;
        background: #fff;
      }
      .showcase-image.is-visible {
        opacity: 1;
        transform: none;
        transition:
          opacity 0.9s ease,
          transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .showcase-image.is-leaving {
        opacity: 0;
        transform: translate3d(-14vw, -7vh, 0) scale(0.84) rotate(-3deg);
        transition:
          opacity 0.85s ease,
          transform 0.85s cubic-bezier(0.7, 0, 0.84, 0.25);
      }
      #flash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 45%,
          #ffdc4826 0,
          transparent 38%
        );
        animation: celebrationPulse 1.8s ease-in-out infinite;
        pointer-events: none;
      }
      .flash-content {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform: translateY(-2vh);
      }
      .confetti-layer,
      .fireworks {
        position: relative;
        z-index: 2;
      }
      .confetti-layer,
      .fireworks {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .confetti {
        position: absolute;
        top: -8%;
        left: var(--x);
        width: var(--size);
        height: calc(var(--size) * 1.8);
        background: var(--color);
        box-shadow: 0 0 8px var(--color);
        opacity: 0;
        animation: confettiFall var(--duration) var(--delay) linear infinite;
      }
      .confetti:nth-child(3n) {
        border-radius: 50%;
      }
      .confetti:nth-child(3n + 1) {
        transform: rotate(28deg);
      }
      .firework {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color);
        box-shadow: 0 0 18px 5px var(--color);
        animation: fireworkCore 1.8s var(--delay) ease-out infinite;
      }
      .firework::before {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        box-shadow:
          0 -68px 0 -2px var(--color),
          34px -58px 0 -2px var(--color),
          60px -34px 0 -2px var(--color),
          68px 0 0 -2px var(--color),
          58px 34px 0 -2px var(--color),
          34px 58px 0 -2px var(--color),
          0 68px 0 -2px var(--color),
          -34px 58px 0 -2px var(--color),
          -58px 34px 0 -2px var(--color),
          -68px 0 0 -2px var(--color),
          -58px -34px 0 -2px var(--color),
          -34px -58px 0 -2px var(--color);
        animation: fireworkBurst 1.8s var(--delay) ease-out infinite;
      }
      @keyframes celebrationPulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      @keyframes confettiFall {
        0% {
          opacity: 0;
          transform: translate3d(0, -10vh, 0) rotate(0deg);
        }
        10% {
          opacity: 1;
        }
        100% {
          opacity: 0.9;
          transform: translate3d(var(--drift), 115vh, 0) rotate(720deg);
        }
      }
      @keyframes fireworkCore {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.2);
        }
        15%,
        55% {
          opacity: 1;
          transform: scale(1);
        }
        75% {
          opacity: 0;
          transform: scale(0.5);
        }
      }
      @keyframes fireworkBurst {
        0% {
          opacity: 0;
          transform: scale(0.1);
        }
        15% {
          opacity: 1;
        }
        60% {
          opacity: 0.9;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.25);
        }
      }
      @keyframes flashIn {
        from {
          opacity: 0;
          transform: scale(1.08);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .flash-line {
        height: 2px;
        background: var(--gold);
        box-shadow: 0 0 18px var(--gold);
        animation: line 3s linear forwards;
      }
      @media (min-width: 900px) and (max-height: 600px) {
        body {
          min-width: 1024px;
          min-height: 512px;
        }
        .stage {
          min-height: 512px;
          padding: 0.75rem 2rem;
        }
        .stage header {
          padding-bottom: 0.25rem;
        }
        .stage header p {
          font-size: 0.85rem;
        }
        .stage header h1 {
          font-size: 4.5rem;
        }
        .ranking-panel {
          padding-top: 0.25rem;
          padding-bottom: 0.25rem;
        }
        .column-head {
          margin-bottom: 0.25rem;
          gap: 1rem;
          padding: 0.25rem 1rem;
          font-size: 1.35rem;
        }
        .ranking-panel #ranking {
          gap: 0.25rem;
        }
        .rank-row {
          min-height: 2.1rem;
          gap: 1rem;
          border-width: 1px;
          border-radius: 10px;
          padding: 0.1rem 1rem;
        }
        .rank-medal {
          width: 3.2rem;
          height: 2rem;
          font-size: 2rem;
          border-width: 1px;
        }
        .rank-row .row-label,
        .rank-row .row-value {
          font-size: 1.25rem;
        }
        .rank-row .row-label {
          min-width: 0;
          padding-inline: 0.15rem;
        }
        .stage footer {
          padding-top: 0.25rem;
        }
        .rabbit {
          top: 13%;
          width: 230px;
        }
      }
      @keyframes line {
        from {
          width: 100%;
        }
        to {
          width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="scanlines fixed inset-0 z-50"></div>
    <main
      class="stage mx-auto flex min-h-screen max-w-[1800px] flex-col px-8 py-5 md:px-12 md:py-7"
    >
      <header class="flex items-end justify-between pb-4">
        <div>
          <p
            class="condensed text-base font-bold uppercase tracking-[.32em] text-[#ffe66e] md:text-xl"
          >
            Boate apresenta
          </p>
          <h1
            class="title-glow condensed text-6xl font-black uppercase leading-[.82] tracking-tight text-[#fff9cb] md:text-[7.2rem]"
          >
            Ranking <span class="text-[#ffd42a]">da noite</span>
          </h1>
        </div>
      </header>
      <img class="rabbit" src="/coelho1.png" alt="Coelho da boate" />
      <section class="ranking-panel flex-1 py-3 md:py-5">
        <div
          class="column-head mb-2 grid grid-cols-[clamp(56px,8vw,112px)_minmax(100px,1fr)_minmax(0,2fr)_minmax(130px,1fr)] items-center gap-4 px-5 py-2 text-center condensed text-xl font-bold uppercase md:gap-8 md:px-8 md:text-3xl"
        >
          <span>Posição</span><span>Mesa</span><span>Cliente</span
          ><span>Valor</span>
        </div>
        <div id="ranking" class="grid gap-3"></div>
        <div id="empty" class="hidden py-28 text-center">
          <p class="condensed text-5xl font-bold uppercase text-white/20">
            A noite está apenas começando
          </p>
        </div>
      </section>
      <footer
        class="flex items-center justify-between pt-3 text-xs uppercase tracking-[.25em] text-white/40"
      >
        <span>Boate apresenta</span><span id="clock"></span>
      </footer>
    </main>
    <div
      id="showcase"
      class="fixed inset-0 z-[70] hidden items-center justify-center"
    >
      <img class="showcase-image" alt="" />
      <video
        class="showcase-image showcase-video"
        muted
        playsinline
        loop
      ></video>
    </div>
    <div
      id="flash"
      class="fixed inset-0 z-[60] hidden flex-col items-center justify-center text-center"
    >
      <div class="flash-line absolute left-0 top-0"></div>
      <div class="fireworks">
        <i
          class="firework"
          style="--x: 18%; --y: 28%; --color: #ffd42a; --delay: 0s"
        ></i>
        <i
          class="firework"
          style="--x: 80%; --y: 25%; --color: #4ce8ff; --delay: 0.55s"
        ></i>
        <i
          class="firework"
          style="--x: 83%; --y: 72%; --color: #ff4fc5; --delay: 1s"
        ></i>
      </div>
      <div id="confetti-layer" class="confetti-layer"></div>
      <div class="flash-content">
        <p
          class="condensed mb-4 text-3xl font-bold uppercase tracking-[.4em] text-[#f6bd45]"
        >
          Flash alert
        </p>
        <div
          class="condensed max-w-[90vw] text-7xl font-black uppercase leading-none md:text-[10rem]"
          id="flash-number"
        ></div>
        <div
          class="mt-7 max-w-[90vw] text-3xl font-bold text-white/80 md:text-5xl"
          id="flash-client"
        ></div>
        <div
          class="mt-12 w-fit max-w-[90vw] rounded-full border-2 border-[#f6bd45]/70 px-10 py-4 text-2xl font-black text-[#fff200] shadow-[0_0_24px_#f6bd4588,inset_0_0_18px_#f6bd4533] md:px-16 md:py-6 md:text-5xl"
          id="flash-value"
        ></div>
      </div>
    </div>
    <script>
      const money = (value) =>
        `R$ ${Number(value).toLocaleString("pt-BR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })}`;
      const ranking = document.querySelector("#ranking");
      const confettiLayer = document.querySelector("#confetti-layer");
      const showcase = document.querySelector("#showcase");
      const showcaseImage = showcase.querySelector(".showcase-image");
      const showcaseVideo = showcase.querySelector(".showcase-video");
      const showcaseMedia = [
        {
          source: "/001.jpeg",
          duration: 16000,
          type: "image",
          contain: true,
        },
        { source: "/002.jpeg", duration: 32000, type: "image" },
        { source: "/003.mp4", duration: 20000, type: "video" },
        { source: "/004.jpeg", duration: 32000, type: "image" },
        { source: "/005.jpeg", duration: 16000, type: "image" },
        { source: "/006.mp4", duration: 19000, type: "video" },
      ];
      let currentRanking = [];
      let showcaseStarted = false;
      let showcaseRun = 0;
      let showcaseStartTimer = null;
      function launchCelebration() {
        const colors = ["#ffd42a", "#4ce8ff", "#ff4fc5", "#ffffff", "#8d61ff"];
        const pieces = Array.from({ length: 44 }, (_, index) => {
          const piece = document.createElement("i");
          piece.className = "confetti";
          piece.style.setProperty("--x", `${(index * 37) % 100}%`);
          piece.style.setProperty("--drift", `${((index * 29) % 160) - 80}px`);
          piece.style.setProperty("--size", `${5 + (index % 4) * 2}px`);
          piece.style.setProperty("--duration", `${4.2 + (index % 5) * 0.55}s`);
          piece.style.setProperty("--delay", `${(index % 9) * 0.12}s`);
          piece.style.setProperty("--color", colors[index % colors.length]);
          return piece;
        });
        confettiLayer.replaceChildren(...pieces);
      }
      function esc(v) {
        return String(v).replace(
          /[&<>'"]/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[c],
        );
      }
      function render(rows = [], animate = false) {
        const previousPositions = new Map(
          [...ranking.querySelectorAll("[data-ranking-id]")].map((element) => [
            element.dataset.rankingId,
            element.getBoundingClientRect().top,
          ]),
        );
        currentRanking = rows;
        document
          .querySelector("#empty")
          .classList.toggle("hidden", rows.length > 0);
        ranking.innerHTML = rows
          .slice(0, 6)
          .map((item, index) => {
            return `<article data-ranking-id="${item.id}" class="rank-row rank-${index + 1} grid grid-cols-[clamp(56px,8vw,112px)_minmax(100px,1fr)_minmax(0,2fr)_minmax(130px,1fr)] items-center gap-4 text-center md:gap-8"><span class="rank-medal condensed">${index + 1}</span><span class="row-label min-w-0 truncate text-center condensed text-2xl font-black uppercase md:text-5xl">${esc(item.numero)}</span><span class="row-label min-w-0 truncate text-center text-base font-bold uppercase md:text-3xl">${esc(item.nomeCliente)}</span><span class="row-value min-w-0 whitespace-nowrap text-center condensed text-2xl font-black md:text-5xl">${money(item.totalGasto)}</span></article>`;
          })
          .join("");
        if (animate) {
          const movedRows = [...ranking.querySelectorAll("[data-ranking-id]")]
            .map((element) => ({
              element,
              distance:
                previousPositions.get(element.dataset.rankingId) -
                element.getBoundingClientRect().top,
            }))
            .filter(
              ({ distance }) =>
                Number.isFinite(distance) && Math.abs(distance) > 2,
            );
          movedRows.forEach(({ element, distance }) => {
            element.classList.add("reordering");
            element.style.transform = `translateY(${distance}px)`;
            element.style.transition = "none";
          });
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              movedRows.forEach(({ element }) => {
                element.style.transition =
                  "transform 2.6s cubic-bezier(0.22, 0.8, 0.2, 1)";
                element.style.transform = "translateY(0)";
              });
            });
          });
        }
      }
      async function load() {
        try {
          const response = await fetch("/api/ranking");
          render(await response.json());
        } catch (error) {
          console.error(error);
        }
      }
      async function startShowcase() {
        if (showcaseStarted) return;
        showcaseStarted = true;
        const currentRun = ++showcaseRun;
        let firstRound = true;
        while (currentRun === showcaseRun) {
          if (!firstRound)
            await new Promise((resolve) => setTimeout(resolve, 20000));
          if (currentRun !== showcaseRun) return;
          firstRound = false;
          showcase.classList.remove("hidden");
          showcase.classList.add("flex");
          requestAnimationFrame(() => showcase.classList.add("is-active"));
          for (const [index, media] of showcaseMedia.entries()) {
            const activeMedia =
              media.type === "video" ? showcaseVideo : showcaseImage;
            const inactiveMedia =
              media.type === "video" ? showcaseImage : showcaseVideo;
            inactiveMedia.className = "showcase-image";
            activeMedia.className = `showcase-image${media.contain ? " showcase-image-contained" : ""}`;
            if (media.type === "video") {
              showcaseVideo.src = media.source;
              showcaseVideo.currentTime = 0;
              showcaseVideo.play().catch(() => {});
            } else {
              showcaseImage.src = media.source;
            }
            void showcaseImage.offsetWidth;
            requestAnimationFrame(() => {
              requestAnimationFrame(() =>
                activeMedia.classList.add("is-visible"),
              );
            });
            await new Promise((resolve) => setTimeout(resolve, media.duration));
            if (currentRun !== showcaseRun) return;
            activeMedia.classList.remove("is-visible");
            activeMedia.classList.add("is-leaving");
            await new Promise((resolve) => setTimeout(resolve, 850));
            if (media.type === "video") showcaseVideo.pause();
            if (index < showcaseMedia.length - 1) {
              activeMedia.className = "showcase-image";
            }
          }
          showcase.classList.remove("is-active");
          await new Promise((resolve) => setTimeout(resolve, 800));
          showcase.classList.remove("flex");
          showcase.classList.add("hidden");
        }
      }
      async function stopShowcase() {
        clearTimeout(showcaseStartTimer);
        showcaseStartTimer = null;
        showcaseRun += 1;
        showcaseStarted = false;
        showcase.classList.remove("is-active");
        await new Promise((resolve) => setTimeout(resolve, 800));
        showcase.classList.remove("flex");
        showcase.classList.add("hidden");
        showcaseImage.className = "showcase-image";
        showcaseVideo.pause();
        showcaseVideo.className = "showcase-image showcase-video";
      }
      function celebrate(venda, transacao, afterAlert) {
        document.querySelector("#flash-number").textContent = venda.numero;
        document.querySelector("#flash-client").textContent = venda.nomeCliente;
        document.querySelector("#flash-value").textContent = money(
          transacao.valor,
        );
        const flash = document.querySelector("#flash");
        launchCelebration();
        flash.classList.remove("hidden");
        flash.classList.add("flex");
        const context = new AudioContext();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.frequency.setValueAtTime(440, context.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(
          880,
          context.currentTime + 0.25,
        );
        gain.gain.setValueAtTime(0.08, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 1);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 1);
        setTimeout(() => {
          flash.classList.add("hidden");
          flash.classList.remove("flex");
          confettiLayer.replaceChildren();
          afterAlert();
        }, 3000);
      }
      const socket = io();
      socket.on("NOVA_VENDA", async (data) => {
        await stopShowcase();
        celebrate(data.venda, data.transacao, () => {
          render(data.ranking, true);
          showcaseStartTimer = setTimeout(startShowcase, 30000);
        });
      });
      socket.on("RANKING_RESET", () => render([]));
      load();
      showcaseStartTimer = setTimeout(startShowcase, 5000);
      setInterval(
        () =>
          (document.querySelector("#clock").textContent =
            new Date().toLocaleTimeString("pt-BR", {
              hour: "2-digit",
              minute: "2-digit",
            })),
        1000,
      );
    </script>
  </body>
</html>
